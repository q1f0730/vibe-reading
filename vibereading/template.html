<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<!-- VibeReading · generated reading page. Zero external requests: no fonts, images or scripts are fetched. -->
<style>
/* ===================== THEMES ===================== */
:root{
  --bg:#faf9f7; --bg2:#f3f0ea; --text:#1a1a1a; --text2:#5e5e5e; --rule:#e5e2db;
  --accent:#c41e3a; --heat:#ff6a3d; --press:20,16,14;
  --night:#16191d; --night-text:#e6e1d8; --night-dim:#a9a397; --night-rule:#2c3137;
  --memory-bg:#f1ede4; --memory-text:#4f483f; --memory-rule:#b9ad97;
  --dim-bg:#f0eee9;
  --font-display:'Noto Serif CJK SC','Source Han Serif SC','Songti SC','STSong','Cormorant Garamond',serif;
  --font-body:'Noto Serif CJK SC','Source Han Serif SC','Songti SC','SimSun',serif;
  --measure:660px; --ease:cubic-bezier(0.25,1,0.5,1); --fs:1;
}
.theme-night{
  --bg:#15171b; --bg2:#1d2025; --text:#e4ded3; --text2:#a39d92; --rule:#2c3137; --accent:#e06a7d;
  --dim-bg:#191c20; --memory-bg:#211f1b; --memory-text:#cfc5b4; --memory-rule:#6d6252; --night:#0d0f12; --press:0,0,0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.95;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.055;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
main,section,footer{position:relative;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ===================== FIXED CHROME ===================== */
.progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:1000}
.ov{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1s var(--ease)}
.ov-blush{background:radial-gradient(ellipse at center,transparent 58%,rgba(255,106,61,.30) 100%)}
.ov-press{background:radial-gradient(ellipse at center,transparent 36%,rgba(var(--press),.45) 100%)}
.tools{position:fixed;top:14px;right:16px;z-index:60;display:flex;gap:6px}
.tools button{height:34px;padding:0 12px;border:1px solid var(--rule);border-radius:17px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  font-size:13px;letter-spacing:.08em;color:var(--text2);backdrop-filter:blur(6px)}
.tools button:hover,.tools button[aria-pressed="true"]{color:var(--text);border-color:var(--text2)}
/* rail: who is here, how close, who blushes */
.rail{position:fixed;z-index:20;left:24px;top:50%;transform:translateY(-50%);width:196px;opacity:0;
  transition:opacity .6s var(--ease);pointer-events:none;font-size:12px;color:var(--text2)}
.rail.on{opacity:1}
.rail .sname{font-family:var(--font-display);font-size:15px;letter-spacing:.2em;color:var(--text)}
.rail .sub{font-size:11.5px;letter-spacing:.08em;margin-top:2px;min-height:1.4em}
.rail canvas{display:block;width:196px;height:132px;margin:8px 0 2px}
.rail .status{min-height:1.5em;font-size:12px;letter-spacing:.06em}
.rail .status b{font-weight:400;color:var(--heat)}
.rail .legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.rail .legend span{white-space:nowrap}.rail .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.rail.dark{color:var(--night-dim)}.rail.dark .sname{color:var(--night-text)}
.topbar{display:none}
/* toc drawer */
.toc{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);z-index:90;background:var(--bg);border-left:1px solid var(--rule);
  transform:translateX(102%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;display:flex;flex-direction:column}
.toc.open{transform:none;visibility:visible;transition:transform .45s var(--ease);box-shadow:-12px 0 40px rgba(0,0,0,.1)}
.toc header{padding:22px 22px 12px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule)}
.toc header b{font-family:var(--font-display);letter-spacing:.25em;font-weight:600}
.toc header span{font-size:12px;color:var(--text2)}
.toc ol{list-style:none;overflow:auto;padding:10px 0 30px;flex:1}
.toc li a{display:grid;grid-template-columns:2.4em 1fr;padding:9px 22px;color:var(--text2);text-decoration:none;font-size:14px;line-height:1.5}
.toc li a small{grid-column:2;font-size:11.5px;opacity:.8}
.toc li a:hover{background:var(--bg2);color:var(--text)}
.toc li.cur a{color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.toc li a em{font-style:normal;color:var(--accent);font-family:var(--font-display)}
.toc li.chap{padding:16px 22px 4px;font-size:12px;letter-spacing:.3em;color:var(--text2)}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.on{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,calc(100% + 60px));visibility:hidden;z-index:95;background:var(--text);color:var(--bg);
  border-radius:24px;padding:10px 10px 10px 20px;font-size:14px;display:flex;gap:12px;align-items:center;transition:transform .5s var(--ease);max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast button{background:var(--bg);color:var(--text);border-radius:16px;padding:4px 14px;font-size:13px;white-space:nowrap}
.toast .x{background:none;color:var(--bg);padding:4px 6px;opacity:.7}

/* ===================== HERO ===================== */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4rem 1.5rem}
#dust{position:absolute;inset:0;width:100%;height:100%}
.hero-inner{position:relative;display:flex;align-items:center;gap:clamp(2rem,6vw,5rem);max-width:980px}
.hero-art{flex:none;width:clamp(130px,18vw,200px)}
.kicker{font-size:.85rem;letter-spacing:.35em;color:var(--text2);margin-bottom:1rem}
.hero-title{font-family:var(--font-display);font-weight:700;font-size:clamp(3rem,8.5vw,6.2rem);line-height:1.08;letter-spacing:.08em;word-break:keep-all}
.hero .dateline{font-family:var(--font-display);font-size:clamp(1.15rem,2.3vw,1.5rem);color:var(--accent);margin:1.1rem 0 .4rem;letter-spacing:.2em;text-align:left}
.hero-sub{color:var(--text2);font-size:1rem;margin-top:.6rem}
.hero-text>*{opacity:0;animation:fadeUp 1.2s var(--ease) forwards}
.hero-text>*:nth-child(2){animation-delay:.25s}.hero-text>*:nth-child(3){animation-delay:.5s}.hero-text>*:nth-child(4){animation-delay:.75s}.hero-text>*:nth-child(5){animation-delay:1s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scroll-cue{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);color:var(--text2);animation:bounce 2.4s infinite}
@keyframes bounce{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
/* hero motifs */
.m-door{position:relative;aspect-ratio:2/3.2;border:2px solid var(--text);border-bottom-width:4px;perspective:600px;background:#efe9de}
.m-door .light{position:absolute;inset:0;background:linear-gradient(100deg,#f7e2b4,#fbf1d9 60%,transparent);opacity:0;animation:lightIn 2.4s 1s var(--ease) forwards}
.m-door .leaf{position:absolute;inset:0;background:var(--bg2);border-right:1px solid var(--text);transform-origin:left center;animation:doorOpen 2.4s 1s var(--ease) forwards}
.m-door .leaf::after{content:"";position:absolute;right:12%;top:52%;width:8px;height:8px;border-radius:50%;background:var(--text)}
@keyframes doorOpen{to{transform:rotateY(-38deg)}}@keyframes lightIn{to{opacity:1}}
.m-window{position:relative;aspect-ratio:3/4;border:2px solid var(--text);background:linear-gradient(#dfe5e6,#eef0ec);overflow:hidden}
.m-window::before,.m-window::after{content:"";position:absolute;background:var(--text)}
.m-window::before{left:50%;top:0;bottom:0;width:2px}.m-window::after{top:50%;left:0;right:0;height:2px}
.m-window canvas{position:absolute;inset:0;width:100%;height:100%}
.m-lamp{position:relative;height:260px}
.m-lamp .cord{position:absolute;left:50%;top:0;width:1.5px;height:110px;background:var(--text);transform-origin:top;animation:swing 5s ease-in-out infinite}
.m-lamp .shade{position:absolute;left:-26px;top:100%;width:54px;height:30px;border:2px solid var(--text);border-bottom:none;border-radius:30px 30px 0 0;background:var(--bg2)}
.m-lamp .cone{position:absolute;left:-90px;top:calc(100% + 28px);width:182px;height:150px;background:radial-gradient(ellipse at top,rgba(247,214,140,.55),transparent 70%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
@keyframes swing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.m-moon{position:relative;aspect-ratio:1;border-radius:50%;box-shadow:inset -22px 8px 0 0 var(--text);opacity:.85;animation:fadeUp 2s var(--ease)}

/* ===================== SCENES + TYPE ===================== */
.scene{padding:clamp(4rem,11vh,7.5rem) 1.5rem}
.col{max-width:var(--measure);margin:0 auto;position:relative}
.marker{font-family:var(--font-display);letter-spacing:.3em;font-size:.9rem;color:var(--text2);display:flex;align-items:baseline;gap:.9rem;margin-bottom:2.4rem;flex-wrap:wrap}
.marker span{color:var(--accent);font-weight:700}
.marker small{letter-spacing:.12em;font-size:.78rem;opacity:.8}
.marker::after{content:"";flex:1;min-width:2rem;height:1px;background:var(--rule);align-self:center}
.line{font-size:calc(clamp(1.05rem,1.15vw + .6rem,1.2rem)*var(--fs));margin-bottom:1.15em;text-align:justify;position:relative}
h2.line{font-family:var(--font-display);font-size:calc(1.9rem*var(--fs));letter-spacing:.15em;text-align:center;margin:1rem 0 3rem}
.dropcap::first-letter{font-family:var(--font-display);float:left;font-size:3.5em;line-height:.9;margin:.08em .12em 0 0;color:var(--accent)}
.fn-ref{color:var(--accent);text-decoration:none;font-size:.75em;vertical-align:super}
/* speaker: a quiet dot in the gutter; the name only for the paragraph being read */
.say::before{content:"";position:absolute;left:-19px;top:.82em;width:6px;height:6px;border-radius:50%;background:var(--sp);opacity:.45;transition:opacity .3s,transform .3s}
.say.cur::before{opacity:1;transform:scale(1.35)}
.say::after{content:attr(data-spn);position:absolute;right:calc(100% + 30px);top:.42em;font-size:12px;letter-spacing:.1em;color:var(--sp);white-space:nowrap;opacity:0;transition:opacity .35s;line-height:1.4}
.say.cur::after{opacity:.95}
.utt{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--sp) 50%,transparent);text-decoration-thickness:1px;text-underline-offset:.38em;text-decoration-skip-ink:none}
.utt:hover{text-decoration-thickness:2px}
.no-sp .say::before,.no-sp .say::after{display:none}.no-sp .utt{text-decoration:none}
/* tones */
.tone-dim{background:var(--dim-bg)}
.tone-night,.night-band{background:var(--night);color:var(--night-text)}
.tone-night .line,.night-band .line{color:var(--night-text)}
.tone-night .marker,.night-band .marker{color:var(--night-dim)}
.tone-night .marker::after{background:var(--night-rule)}
.tone-night .fig figcaption,.night-band .fig figcaption{color:var(--night-dim)}
.night-band{margin:3rem calc(50% - 50vw) 0;padding:3rem calc(50vw - 50%) 2rem}
/* inside a memory column (asymmetric border) a full-bleed band would overflow by the border width → keep it in the column */
.tone-memory .night-band,.memory-block .night-band{margin:2.4rem 0 0;padding:2rem 1.2rem 1.4rem}
.tone-memory .col,.memory-block{background:var(--memory-bg);padding:2.4rem 1.8rem 1.2rem;border-left:3px solid var(--memory-rule)}
.memory-block{margin:2.4rem 0}.memory-block .line{color:var(--memory-text)}.memory-block .fig{margin:0 auto 1.6rem}
.tone-memory .line{color:var(--memory-text)}
.tone-memory .say::before,.memory-block .say::before{left:-14px}
.tone-memory .say::after,.memory-block .say::after{display:none}
/* ===================== REVEAL ===================== */
.js .reveal{opacity:0;transform:translateY(12px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.js .reveal.visible{opacity:1;transform:none}

/* ===================== COMPONENTS ===================== */
.fig{margin:2.6rem auto 3rem;text-align:center}
.fig figcaption{font-size:.8rem;letter-spacing:.2em;color:var(--text2);margin-top:.8rem}
.ink{width:100%;height:auto;fill:none;stroke:var(--text);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ink .thick{stroke-width:2.6}.ink .soft{stroke:var(--text2)}.ink .fillc{fill:var(--bg2)}
.ink .fill-dark{fill:#5b3a26;stroke:none}.ink .fill-warm{fill:rgba(214,170,60,.35)}
.ink text{fill:var(--text);stroke:none;font-family:var(--font-display);font-size:22px}
/* doorbell */
.bell{position:relative;width:120px;height:120px;margin:0 auto}
.bell-plate{position:absolute;inset:34px;border:1.5px solid var(--text);border-radius:10px;background:var(--bg2)}
.bell-btn{position:absolute;inset:14px;border-radius:50%;border:1.5px solid var(--text);background:var(--bg)}
.visible .bell-btn{animation:press .5s .3s 2 var(--ease)}
@keyframes press{50%{transform:scale(.82);background:var(--accent)}}
.ring{position:absolute;inset:34px;border:1.5px solid var(--accent);border-radius:50%;opacity:0}
.visible .ring{animation:ring 2.2s var(--ease) infinite}.visible .r2{animation-delay:.5s}.visible .r3{animation-delay:1s}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.4);opacity:0}}
.c-doorbell figcaption{letter-spacing:.5em;color:var(--accent)}
/* door */
.c-door .frame{width:74px;height:116px;margin:0 auto;border:2px solid var(--text);border-bottom-width:4px;perspective:300px;background:#f3e3bd}
.c-door .leaf{position:relative;width:100%;height:100%;background:var(--bg2);border-right:1px solid var(--text);transform-origin:left;transition:transform 1.8s .4s var(--ease);background-image:linear-gradient(var(--rule),var(--rule)),linear-gradient(var(--rule),var(--rule));background-size:64% 1px,64% 1px;background-position:50% 22%,50% 60%;background-repeat:no-repeat}
.c-door .leaf::after{content:"";position:absolute;right:10%;top:50%;width:7px;height:7px;border-radius:50%;background:var(--text)}
.c-door[data-a=open] .leaf{transform:rotateY(0)}.c-door[data-a=open].visible .leaf{transform:rotateY(-62deg)}
.c-door[data-a=close] .leaf{transform:rotateY(-70deg)}.c-door[data-a=close].visible .leaf{transform:rotateY(0)}
.c-door[data-a=ajar] .leaf{transform:rotateY(0)}.c-door[data-a=ajar].visible .leaf{transform:rotateY(-24deg)}
/* stamp cards */
.c-stamp{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap}
.c-stamp figcaption{width:100%}
.card{width:150px;padding:1rem;border:1px solid var(--rule);background:var(--bg);box-shadow:0 1px 0 var(--rule);text-align:left}
.card small{display:block;font-size:.75rem;letter-spacing:.15em;color:var(--text2)}
.stamp{display:inline-block;margin-top:.4rem;font-family:var(--font-display);font-size:2rem;line-height:1.3;color:var(--accent);border:2px solid var(--accent);padding:0 .5rem;
  transform:rotate(-8deg) scale(1.8);opacity:0;transition:all .45s cubic-bezier(.34,1.56,.64,1) .3s;white-space:nowrap}
.c-stamp.visible .stamp{transform:rotate(-8deg) scale(1);opacity:.9}
.c-stamp.visible .card:nth-child(2) .stamp{transition-delay:.9s}.c-stamp.visible .card:nth-child(3) .stamp{transition-delay:1.5s}
/* object */
.c-object svg{width:120px;overflow:visible}
.c-object .spin{transform-box:view-box;transform-origin:60px 60px}
.c-object.visible .spin{animation:wobble 4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
.c-object .steam path{stroke:var(--text2);stroke-dasharray:4 6;opacity:0}
.c-object.visible .steam path{animation:steam 3.2s ease-in-out infinite}.c-object.visible .steam path:nth-child(2){animation-delay:1s}.c-object.visible .steam path:nth-child(3){animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.c-object .drop{transform-box:view-box}
.c-object.visible .drop{animation:drop 1.4s .5s cubic-bezier(.5,0,.75,0) forwards}
@keyframes drop{to{transform:translateY(22px) rotate(14deg)}}
.c-object .flame{transform-box:fill-box;transform-origin:50% 100%;fill:#e9a23b;stroke:none}
.c-object.visible .flame{animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.85,1.15)}}
/* blur chart */
.blurc{width:min(100%,360px);fill:none;stroke:var(--text);stroke-width:1.2}
.blurc rect{fill:color-mix(in srgb,var(--text) 9%,transparent)}
.c-blur.visible .blurc{animation:stare 7s 1s ease-in forwards}
@keyframes stare{to{filter:blur(3.5px);opacity:.55}}
/* window */
.c-window .glass{position:relative;background:linear-gradient(180deg,#eef1f0,#f6f5f1);overflow:hidden}
.theme-night .say::before{opacity:.65}
.theme-night .c-window .glass,.c-window[data-w=night] .glass{background:linear-gradient(180deg,#1f2833,#2b333d)}
.c-window[data-w=night] .ink,.theme-night .c-window .ink{stroke:#cfc8bb}
.c-window .glass canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.c-window .view{stroke:#6c7b6a}
.breath{position:absolute;left:50%;top:55%;width:34%;height:46%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);opacity:0;filter:blur(6px)}
.c-window.visible .breath{animation:breath 5.5s 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}35%{opacity:.75;transform:translate(-50%,-50%) scale(1)}}
.c-window[data-w=fog] .glass::after{content:"";position:absolute;inset:0;background:rgba(240,242,240,.55);backdrop-filter:blur(2px)}
/* car */
.car{width:100%;height:auto}
.car .frame{fill:none;stroke:#d9d3c7;stroke-width:2}.car .road{stroke:#6a6e72;stroke-width:1.4;fill:none}
.car .horizon{stroke:#4b5056;stroke-width:1}
.car .dashl{stroke:#d8cfa8;stroke-width:3;stroke-dasharray:10 18;animation:road 1.1s linear infinite}
@keyframes road{to{stroke-dashoffset:-28}}
.car .mirror{fill:#2a2f35;stroke:#d9d3c7;stroke-width:1.5}.car .board{fill:#0f1114}.car .wheel{fill:none;stroke:#3a4048;stroke-width:6}
.car .sweep{fill:rgba(255,236,190,.12);animation:sweep 6s 1s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(900px)}}
.c-car figcaption{color:var(--night-dim)}
/* stairs memory */
.c-stairs svg{width:150px}
.c-stairs path{stroke:var(--memory-rule)}
.c-stairs .robe{fill:var(--bg);stroke:var(--memory-rule);opacity:0;transition:opacity 1s 1.2s,transform 3s 2.2s var(--ease)}
.c-stairs.visible .robe{opacity:1;transform:translate(-26px,26px)}
/* knock */
.c-knock .frame{position:relative;width:60px;height:90px;margin:0 auto;border:2px solid var(--text);border-bottom:none}
.k{position:absolute;right:-2px;top:40%;width:18px;height:18px;border:1.5px solid var(--kc,var(--accent));border-radius:50%;opacity:0}
.c-knock.visible .k{animation:knock 1.6s .4s var(--ease) 2}.c-knock.visible .k2{animation-delay:.65s}
@keyframes knock{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
.c-knock figcaption{color:var(--kc,var(--accent))}
/* silence */
.c-silence{height:28vh;display:flex;align-items:center;justify-content:center;margin:1rem 0}
.c-silence[data-l=long]{height:48vh}
.c-silence i{width:5px;height:5px;border-radius:50%;background:var(--text2);opacity:0;transition:opacity 2.6s .6s}
.c-silence.visible i{opacity:.55;animation:fadeDot 6s 3s ease-in-out infinite}
@keyframes fadeDot{50%{opacity:.08}}
/* timeline */
.c-timeline ol{list-style:none;display:flex;justify-content:space-between;position:relative;max-width:560px;margin:0 auto;padding-top:22px}
.c-timeline ol::before{content:"";position:absolute;left:6%;right:6%;top:28px;height:1px;background:var(--rule)}
.c-timeline ol::after{content:"";position:absolute;left:6%;top:28px;height:1px;width:0;background:var(--text);transition:width 4.5s .4s linear}
.c-timeline.visible ol::after{width:88%}
.c-timeline li{position:relative;flex:1;text-align:center;font-size:.85rem;letter-spacing:.1em;color:var(--text2);padding-top:16px}
.c-timeline li::before{content:"";position:absolute;left:50%;top:0;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;border:1.5px solid var(--text2);background:var(--bg);transition:background .4s}
.c-timeline.visible li::before{background:var(--text);transition-delay:calc(var(--n)*.85s + .4s)}
/* ledger (粉板 / chalkboard) */
.c-ledger .board{display:inline-block;min-width:240px;max-width:100%;padding:1.2rem 1.8rem 1.4rem;background:#2f3a35;border:6px solid #6b5640;border-radius:3px;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.c-ledger .row{position:relative;color:#ecebe2;font-family:var(--font-display);font-size:1.15rem;letter-spacing:.12em;line-height:2;white-space:nowrap}
.c-ledger .row::after{content:"";position:absolute;inset:.35em -.4em;background:#2f3a35;transform:scaleX(0);transform-origin:left;transition:transform 1.6s 1.2s var(--ease);box-shadow:0 0 8px 4px #2f3a35}
.c-ledger.visible .row.erased::after{transform:scaleX(1)}
.c-ledger.visible .row.erased{color:rgba(236,235,226,.35)}
/* sound burst */
.c-sound .field{position:relative;height:150px;max-width:520px;margin:0 auto}
.c-sound .g{position:absolute;font-family:var(--font-display);color:var(--text2);opacity:0;line-height:1}
.c-sound.visible .g{animation:burst 3.4s var(--ease) infinite;animation-delay:var(--d)}
@keyframes burst{0%{opacity:0;transform:scale(.6)}25%{opacity:.75}100%{opacity:0;transform:scale(1.25) translateY(-14px)}}
/* pull quote */
.pull{margin:4rem 0;padding:2.4rem 1.6rem 2rem;border-top:1px solid var(--text);border-bottom:1px solid var(--text);display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center}
.pull.noicon{grid-template-columns:1fr}
.pull blockquote{font-family:var(--font-display);font-size:clamp(1.25rem,1.8vw + .6rem,1.6rem);line-height:1.6}
.pull-src{font-size:.75rem;letter-spacing:.2em;color:var(--text2)}
.pull:not(.noicon) .pull-src{grid-column:2}
.door-mini{width:44px;height:70px;border:1.5px solid var(--text);perspective:200px;background:#f3e3bd;grid-row:span 2}
.door-mini .leaf{width:100%;height:100%;background:var(--bg2);border-right:1px solid var(--text);transform-origin:left;transform:rotateY(-70deg);transition:transform 1.8s .6s var(--ease)}
.pull.visible .door-mini .leaf{transform:rotateY(0)}
.qmark{font-family:var(--font-display);font-size:4rem;line-height:.6;color:var(--accent);grid-row:span 2;align-self:start}
.tone-night .pull{border-color:var(--night-dim)}
/* footnotes */
.notes{padding:3rem 1.5rem 5rem;border-top:1px solid var(--rule);background:var(--bg2)}
.notes .line{font-size:.88rem;color:var(--text2);text-align:left}
.fn-back{color:var(--accent);text-decoration:none;margin-left:.4rem}
.fin{text-align:center;letter-spacing:1.2em;color:var(--text2);margin-top:5rem;font-size:1.2rem}
:target{scroll-margin-top:90px}
/* chapters (whole-book mode): only the current chapter is in the DOM */
.chapter[hidden]{display:none}
.chnav{max-width:var(--measure);margin:2rem auto 6rem;padding:0 1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.chnav a{display:block;padding:1.1rem 1.2rem;border:1px solid var(--rule);color:var(--text);text-decoration:none;font-family:var(--font-display);letter-spacing:.08em;line-height:1.5}
.chnav a small{display:block;font-family:var(--font-body);font-size:.75rem;letter-spacing:.2em;color:var(--text2);margin-bottom:.2rem}
.chnav a:hover{border-color:var(--text2);background:var(--bg2)}
.chnav .next{text-align:right;grid-column:2}.chnav .end{grid-column:2;text-align:right;color:var(--text2);letter-spacing:.3em;align-self:center}
.toc li.chap a{display:block;padding:0;font-size:12px;letter-spacing:.2em;color:var(--text2)}
.toc li.chap.cur a{color:var(--text);box-shadow:none}
@media (max-width:640px){.chnav{grid-template-columns:1fr}.chnav .next,.chnav .end{grid-column:1}}
.flash{animation:flash 2s var(--ease)}@keyframes flash{0%,30%{background:color-mix(in srgb,var(--accent) 14%,transparent)}100%{background:transparent}}

/* ===================== RESPONSIVE ===================== */
@media (max-width:1099px){
  .rail{display:none}.tools{display:none}
  .topbar{display:flex;position:fixed;left:0;right:0;top:0;height:50px;z-index:60;align-items:center;gap:8px;padding:0 6px 0 4px;
    background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--rule);backdrop-filter:blur(6px);
    transform:translateY(-100%);transition:transform .4s var(--ease),background .4s}
  .topbar.on{transform:none}
  .topbar.dark{background:rgba(13,15,18,.94);border-color:var(--night-rule);color:var(--night-text)}
  .topbar button{width:38px;height:38px;flex:none;font-size:15px;color:inherit;opacity:.8}
  .topbar .tt{flex:1;min-width:0;line-height:1.25}
  .topbar .tt b{display:block;font-weight:600;font-size:13.5px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .tt small{display:block;font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar canvas{width:112px;height:40px;flex:none}
  .scene,.notes{scroll-margin-top:56px}
  .say::after{display:none}
}
@media (max-width:640px){
  .hero-inner{flex-direction:column;text-align:center;gap:2rem}.hero .dateline{text-align:center}
  .hero-art{width:120px}
  .line{text-align:left}
  .say::before{left:-13px}
  .utt{text-decoration-color:color-mix(in srgb,var(--sp) 38%,transparent)}
  .scene{padding-left:1.35rem;padding-right:1.35rem}
  .pull{grid-template-columns:1fr;padding:2rem .4rem}.door-mini,.qmark{grid-row:auto}.pull:not(.noicon) .pull-src{grid-column:1}
  .tone-memory .col,.memory-block{padding:1.8rem 1.1rem 1rem 1.3rem}
  .c-timeline li{font-size:.72rem;letter-spacing:0}
  .c-ledger .board{min-width:0;padding:1rem 1.2rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .reveal{opacity:1;transform:none}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
{{CHAR_CSS}}
</style>
</head>
<body class="no-js">
<div class="progress" id="progress"></div>
<div class="ov ov-blush" id="ovBlush"></div>
<div class="ov ov-press" id="ovPress"></div>
<div class="tools" role="toolbar" aria-label="阅读设置">
  <button id="bToc" aria-label="目录">目录</button>
  <button id="bTheme" aria-pressed="false" aria-label="夜间主题">夜间</button>
  <button id="bSp" aria-pressed="true" aria-label="显示说话人标记">说话人</button>
</div>
<div class="topbar" id="topbar">
  <button id="mToc" aria-label="目录">☰</button>
  <div class="tt" aria-hidden="true"><b id="mName"></b><small id="mSub"></small></div>
  <canvas id="mThread" aria-hidden="true"></canvas>
  <button id="mTheme" aria-label="切换夜间主题">◐</button>
</div>
<div class="rail" id="rail" aria-hidden="true">
  <div class="sname" id="sName"></div><div class="sub" id="sSub"></div>
  <canvas id="thread"></canvas>
  <div class="status" id="status"></div>
  <div class="legend" id="legend"></div>
</div>
<div class="scrim" id="scrim"></div>
<nav class="toc" id="toc" aria-label="目录"><header><b>目 录</b><span id="tocPct">0%</span></header><ol>{{TOC}}</ol></nav>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastGo">继续阅读</button><button class="x" id="toastX" aria-label="关闭">✕</button></div>
<main>
{{BODY}}
</main>
<script>
const STATE = {{STATE}};
document.body.classList.remove('no-js'); document.documentElement.classList.add('js');
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const LS = 'vibereading:' + STATE.key;
const store = { get(k, d){ try { const v = localStorage.getItem(LS + ':' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem(LS + ':' + k, JSON.stringify(v)); } catch(e){} } };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- theme + speaker toggles ---------- */
function setTheme(t){ document.body.classList.toggle('theme-night', t === 'night'); $('#bTheme').setAttribute('aria-pressed', t === 'night'); store.set('theme', t); }
setTheme(store.get('theme', STATE.defaultTheme));
$('#bTheme').onclick = $('#mTheme').onclick = () => setTheme(document.body.classList.contains('theme-night') ? 'paper' : 'night');
function setSp(on){ document.body.classList.toggle('no-sp', !on); $('#bSp').setAttribute('aria-pressed', on); store.set('sp', on); }
setSp(store.get('sp', true)); $('#bSp').onclick = () => setSp(document.body.classList.contains('no-sp'));

/* ---------- toc ---------- */
const toc = $('#toc'), scrim = $('#scrim');
function openToc(o){ toc.classList.toggle('open', o); scrim.classList.toggle('on', o); }
$('#bToc').onclick = $('#mToc').onclick = () => openToc(true); scrim.onclick = () => openToc(false);
addEventListener('keydown', e => { if (e.key === 'Escape') openToc(false); });
$('#toc').addEventListener('click', e => { if (e.target.closest('a')) openToc(false); });

/* ---------- ink draw-on + reveal (wire() runs again for each chapter that is mounted) ---------- */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){
  e.target.classList.add('visible');
  e.target.querySelectorAll('.ink :is(path,rect,line,circle,ellipse,polyline)').forEach(el => el.style.strokeDashoffset = 0);
  io.unobserve(e.target); } }), { threshold: 0.12 });
function wire(root){
  if (!reduce) root.querySelectorAll('.draw .ink :is(path,rect,line,circle,ellipse,polyline)').forEach(el => {
    try { const L = Math.ceil(el.getTotalLength()) + 1; el.style.strokeDasharray = L; el.style.strokeDashoffset = L;
    el.style.transition = 'stroke-dashoffset 2.2s cubic-bezier(0.25,1,0.5,1)'; } catch(e){}
  });
  root.querySelectorAll('.reveal').forEach(el => io.observe(el));
  if (!reduce) root.querySelectorAll('canvas[data-weather]').forEach(c => particles(c, c.dataset.weather));
}

/* ---------- particles: hero dust + window weather (only while on screen; stop once unmounted) ---------- */
function particles(cv, kind){
  const ctx = cv.getContext('2d'); let W = 0, H = 0, on = false, ps = [];
  const N = {dust:46, rain:70, snow:60, wind:18, night:40, clear:0, fog:0}[kind] || 0; if (!N) return;
  function size(){ W = cv.width = cv.offsetWidth * devicePixelRatio; H = cv.height = cv.offsetHeight * devicePixelRatio; }
  size(); addEventListener('resize', size);
  for (let i = 0; i < N; i++) ps.push({x:Math.random(), y:Math.random(), r:Math.random()*1.6+.4, v:Math.random()*.0003+.0001, p:Math.random()*6});
  const ob = new IntersectionObserver(e => { on = e[0].isIntersecting; if (on && !W) size(); }); ob.observe(cv);
  const d = devicePixelRatio;
  (function loop(t){
    if (!cv.isConnected){ ob.disconnect(); removeEventListener('resize', size); return; }
    if (on && W){ ctx.clearRect(0,0,W,H);
      for (const p of ps){
        if (kind === 'dust'){ p.y -= p.v; p.x += Math.sin(t/3000+p.p)*.00012; if (p.y < 0) p.y = 1;
          ctx.beginPath(); ctx.arc(p.x*W, p.y*H, p.r*d, 0, 7); ctx.fillStyle = 'rgba(196,150,80,'+(.18+.15*Math.sin(t/900+p.p))+')'; ctx.fill(); }
        else if (kind === 'rain'){ p.y += p.v*28; p.x -= p.v*4; if (p.y > 1){ p.y = 0; p.x = Math.random()*1.1; }
          ctx.strokeStyle = 'rgba(90,110,130,.35)'; ctx.lineWidth = d; ctx.beginPath(); ctx.moveTo(p.x*W, p.y*H); ctx.lineTo(p.x*W - 2*d, p.y*H + 12*d); ctx.stroke(); }
        else if (kind === 'snow' || kind === 'night'){ p.y += p.v*(kind==='snow'?3:0); p.x += Math.sin(t/1600+p.p)*.0004; if (p.y > 1) p.y = 0;
          ctx.beginPath(); ctx.arc(p.x*W, p.y*H, p.r*d*(kind==='snow'?1.4:.7), 0, 7);
          ctx.fillStyle = kind==='snow' ? 'rgba(255,255,255,.9)' : 'rgba(255,248,220,'+(.3+.4*Math.sin(t/700+p.p))+')'; ctx.fill(); }
        else if (kind === 'wind'){ p.x += p.v*9; p.y += Math.sin(t/500+p.p)*.002; if (p.x > 1.05){ p.x = -.05; p.y = Math.random(); }
          ctx.save(); ctx.translate(p.x*W, p.y*H); ctx.rotate(t/400+p.p); ctx.fillStyle = 'rgba(160,110,50,.55)';
          ctx.beginPath(); ctx.ellipse(0,0,5*d,2.2*d,0,0,7); ctx.fill(); ctx.restore(); }
      } }
    requestAnimationFrame(loop);
  })(0);
}
if (!reduce){ const du = $('#dust'); if (du) particles(du, 'dust'); }
$$('.hero canvas[data-weather]').forEach(c => !reduce && particles(c, c.dataset.weather));

/* ---------- chapters (whole-book mode): mount one chapter at a time ---------- */
const CHS = STATE.chapters;
let curCh = 0;
const chSec = k => document.getElementById('c' + k);
if (CHS) $$('.chapter[data-live]').forEach(sec => {   // keep a pristine copy so the first chapter can be unmounted / remounted too
  if (!sec.querySelector('template')){ const tp = document.createElement('template'); [...sec.childNodes].forEach(n => tp.content.appendChild(n.cloneNode(true))); sec.prepend(tp); }
});
$$('main > section:not(.chapter):not(.hero), main > footer, .chapter[data-live]').forEach(wire);
function mount(k){
  const sec = chSec(k); if (!sec) return null;
  if (!sec.dataset.live){ sec.appendChild(sec.querySelector('template').content.cloneNode(true)); sec.dataset.live = '1'; wire(sec); }
  sec.hidden = false; return sec;
}
function unmount(k){
  const sec = chSec(k); if (!sec || !sec.dataset.live) return;
  [...sec.childNodes].forEach(n => { if (n.nodeName !== 'TEMPLATE') n.remove(); });
  delete sec.dataset.live; sec.hidden = true;
}
function showChapter(k){
  if (!CHS || k < 0 || k >= CHS.length) return false;
  if (k === curCh && chSec(k).dataset.live) return false;
  mount(k); if (k !== curCh) unmount(curCh); curCh = k; store.set('ch', k);
  relist(); return true;
}
function chapterOf(idx){ return CHS ? STATE.scenes[STATE.paras[idx].s].c : 0; }
// jump to an element id that may live in an unmounted chapter
function goTo(id, block){
  let el = document.getElementById(id);
  if (!el && CHS){
    let k = -1;
    if (/^c\d+$/.test(id)) k = +id.slice(1);
    else if (/^s\d+$/.test(id)) k = STATE.scenes[+id.slice(1) - 1]?.c ?? -1;
    if (k >= 0){ showChapter(k); el = document.getElementById(id); }
  } else if (el && CHS && /^c\d+$/.test(id)) { showChapter(+id.slice(1)); }
  if (!el) return false;
  el.scrollIntoView({block: block || 'start', behavior: 'instant'}); return el;
}
window.VR = { show: showChapter, goTo,
  renderAll(){ if (CHS) CHS.forEach((_, k) => mount(k)); relist(); } };   // used by the verifier: put every chapter in the DOM

/* ---------- reading state: scene label, rail, overlays, progress, position ---------- */
let lines = [], tops = [], cur = -1;
function measure(){ tops = lines.map(e => e.getBoundingClientRect().top + scrollY); }
function relist(){ lines = $$('main [data-src]').filter(e => !e.closest('.notes')); cur = -1; measure(); }
relist();
measure(); addEventListener('resize', () => { measure(); pick(); }); addEventListener('load', () => { measure(); pick(); });
if (document.fonts) document.fonts.ready.then(() => { measure(); pick(); });
const ST = STATE.paras, CH = STATE.chars, cmap = Object.fromEntries(CH.map(c => [c.id, c]));
const target = {st: ST[0]};
const legend = $('#legend'); function paintLegend(){ const n = document.body.classList.contains('theme-night'); legend.innerHTML = CH.map(c => `<span><i style="background:${n ? c.night : c.color}"></i>${c.name}</span>`).join(''); }
paintLegend(); $('#bTheme').addEventListener('click', paintLegend); $('#mTheme').addEventListener('click', paintLegend);
let lastSave = 0;
function pick(){
  if (!lines.length) return;
  const y = scrollY + innerHeight * 0.5;
  let lo = 0, hi = tops.length - 1, k = 0;
  while (lo <= hi){ const m = (lo + hi) >> 1; if (tops[m] < y){ k = m; lo = m + 1; } else hi = m - 1; }
  const el = lines[k], idx = +el.dataset.src;
  if (cur !== idx){ const p = lines.find(e => e.classList.contains('cur')); if (p) p.classList.remove('cur'); el.classList.add('cur'); cur = idx; }
  const st = ST[idx], sc = STATE.scenes[st.s];
  const past = scrollY > innerHeight * 0.6;
  $('#rail').classList.toggle('on', past); $('#topbar').classList.toggle('on', past);
  // darkness is decided by what is actually behind the rail / top bar, not by the paragraph being read
  const under = (x, y) => { const e = document.elementFromPoint(x, y); return !!(e && e.closest('.tone-night,.night-band')); };
  $('#rail').classList.toggle('dark', under(30, innerHeight / 2) && !document.body.classList.contains('theme-night'));
  $('#topbar').classList.toggle('dark', under(innerWidth / 2, 60));
  $('#sName').textContent = $('#mName').textContent = sc.name;
  $('#sSub').textContent = $('#mSub').textContent = [sc.time, sc.place].filter(Boolean).join(' · ');
  const bw = st.bl > 0.35 && st.bw ? cmap[st.bw] : null;
  $('#status').innerHTML = bw ? `<b>●</b> ${bw.name} · 脸红` : (st.te > 0.6 ? '· 气氛紧绷' : '');
  $('#ovBlush').style.opacity = st.bl > 0.3 ? Math.min(.8, (st.bl - 0.2) * 1.0) : 0;
  $('#ovPress').style.opacity = st.te > 0.45 ? Math.min(.85, (st.te - 0.45) * 1.9) : 0;
  const doc = document.documentElement.scrollHeight - innerHeight;
  let pct = Math.max(0, Math.min(100, scrollY / doc * 100));
  if (CHS){   // whole book: progress = chapters before + position inside this chapter, weighted by length
    const sec = chSec(curCh), tot = CHS.reduce((a, c) => a + c.chars, 0);
    const before = CHS.slice(0, curCh).reduce((a, c) => a + c.chars, 0);
    const r = sec ? Math.max(0, Math.min(1, (scrollY + innerHeight - sec.offsetTop) / Math.max(1, sec.offsetHeight))) : 0;
    pct = (before + r * CHS[curCh].chars) / tot * 100;
  }
  $('#progress').style.width = pct + '%'; $('#tocPct').textContent = (CHS ? `第 ${curCh + 1}/${CHS.length} 章 · ` : '') + Math.round(pct) + '%';
  $$('.toc li.cur').forEach(l => l.classList.remove('cur')); const tl = $(`.toc li[data-s="${st.s}"]`); if (tl) tl.classList.add('cur');
  if (CHS){ const cl = $(`.toc li.chap[data-c="${curCh}"]`); if (cl) cl.classList.add('cur'); }
  const now = Date.now(); if (past && now - lastSave > 800){ store.set('pos', idx); lastSave = now; }
  target.st = st;
}
addEventListener('scroll', () => requestAnimationFrame(pick), {passive:true});

/* resume */
(function(){
  const pos = store.get('pos', 0);
  if (pos > 2 && pos < ST.length && !location.hash){
    const sc = STATE.scenes[ST[pos].s];
    $('#toastText').textContent = (CHS ? `上次读到第 ${sc.c + 1} 章「${sc.name}」` : `上次读到「${sc.name}」`) + ` · 第 ${pos + 1} 段`;
    $('#toast').classList.add('on');
    $('#toastGo').onclick = () => { $('#toast').classList.remove('on'); if (CHS) showChapter(chapterOf(pos));
      const el = $(`[data-src="${pos}"]`); if (!el) return; el.scrollIntoView({block:'center'}); el.classList.add('flash'); };
    $('#toastX').onclick = () => $('#toast').classList.remove('on');
    setTimeout(() => $('#toast').classList.remove('on'), 9000);
  }
})();
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const id = a.getAttribute('href').slice(1);
  if (a.matches('.fn-ref, .fn-back')){ const t = document.getElementById(id); if (t){ setTimeout(() => { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }, 300); } return; }
  if (CHS && (/^[cs]\d+$/.test(id))){ e.preventDefault(); if (goTo(id)) requestAnimationFrame(pick); }   // no hash: a reload should offer "continue reading", not jump to the chapter top
});
if (CHS && /^#[cs]\d+$/.test(location.hash)) requestAnimationFrame(() => goTo(location.hash.slice(1)));

/* ---------- relation canvas (desktop rail + mobile topbar) ---------- */
const anim = {in: 0, bl: 0, te: 0, a: {}};
CH.forEach(c => anim.a[c.id] = 0);
const FP = STATE.focal;
function drawCanvas(cv, t, mini){
  const cx = cv.getContext('2d'), w = cv.clientWidth, h = cv.clientHeight, d = devicePixelRatio;
  if (!w) return;
  if (cv.width !== Math.round(w*d)){ cv.width = Math.round(w*d); cv.height = Math.round(h*d); }
  cx.setTransform(d,0,0,d,0,0); cx.clearRect(0,0,w,h);
  const night = document.body.classList.contains('theme-night') || $('#rail').classList.contains('dark') || (mini && $('#topbar').classList.contains('dark'));
  const ink = night ? '#e6e1d8' : '#1a1a1a', r = mini ? 7 : 8.5;
  const st = target.st, mid = w/2, cy = mini ? h*0.5 : h*0.4;
  const gap = (mini ? 10 : 14) + (1 - anim.in) * (w * (mini ? 0.3 : 0.3));
  const pos = {};
  if (FP.length === 2){ pos[FP[0]] = {x: mid - gap, y: cy}; pos[FP[1]] = {x: mid + gap, y: cy}; }
  else if (FP.length === 1){ pos[FP[0]] = {x: mid, y: cy}; }
  // non-focal characters: lay out only those on stage (or still fading out), so labels never pile up
  const others = CH.filter(c => !(c.id in pos) && (st.pr.includes(c.id) || anim.a[c.id] > .03));
  const n = others.length, sp = Math.min(60, (w - 24) / Math.max(1, n)), tight = sp < 44;
  others.forEach((c, i) => {
    pos[c.id] = mini ? {x: mid + (i - (n-1)/2) * 16, y: 8} : {x: mid + (i - (n-1)/2) * sp, y: h * 0.8, tight};
  });
  CH.forEach(c => { if (!pos[c.id]) pos[c.id] = {x: -99, y: -99}; });
  // thread between the focal pair
  if (FP.length === 2){
    const A = pos[FP[0]], B = pos[FP[1]], vis = Math.min(anim.a[FP[0]], anim.a[FP[1]]);
    if (vis > .2){
      const sag = (1 - anim.in) * h * (mini ? .25 : .3), trem = Math.pow(anim.in, 3) * 2.4 * Math.sin(t/38);
      cx.beginPath(); cx.moveTo(A.x, A.y); cx.quadraticCurveTo(mid, cy + sag + trem, B.x, B.y);
      cx.strokeStyle = night ? `rgba(230,225,216,${(.2 + anim.in*.6)*vis})` : `rgba(80,60,60,${(.18 + anim.in*.6)*vis})`;
      cx.lineWidth = 1 + anim.in * 1.3; cx.setLineDash(anim.te > .55 ? [3,3] : []); cx.stroke(); cx.setLineDash([]);
    }
  }
  for (const c of CH){
    const a = anim.a[c.id]; if (a < .03) continue;
    const p = pos[c.id], isFocal = FP.includes(c.id), rr = isFocal ? r : (p.tight ? r * .95 : r * .75);
    if (!isFocal && mini) { cx.globalAlpha = a; cx.beginPath(); cx.arc(p.x, p.y, 3.2, 0, 7); cx.fillStyle = night ? c.night : c.color; cx.fill(); cx.globalAlpha = 1; continue; }
    // blush: a pulsing coral halo, never a colour change of the dot itself
    if (st.bw === c.id && anim.bl > .25){
      const pulse = 1 + .12 * Math.sin(t/260), R = rr * (2.1 + anim.bl) * pulse;
      const g = cx.createRadialGradient(p.x, p.y, rr * .8, p.x, p.y, R);
      g.addColorStop(0, `rgba(255,106,61,${.75*anim.bl})`); g.addColorStop(1, 'rgba(255,106,61,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, R, 0, 7); cx.fill();
    }
    cx.globalAlpha = a; cx.beginPath(); cx.arc(p.x, p.y, rr, 0, 7); cx.fillStyle = night ? c.night : c.color; cx.fill();
    if (st.sp === c.id){ cx.beginPath(); cx.arc(p.x, p.y, rr + 3.5, 0, 7); cx.strokeStyle = night ? c.night : c.color; cx.lineWidth = 1.2; cx.stroke(); }
    if (!mini){
      cx.fillStyle = ink; cx.font = '12px serif'; cx.textAlign = 'center';
      const ly = isFocal ? p.y - rr - 7 : p.y + rr + 14;
      if (p.tight){ cx.fillStyle = '#fff'; cx.font = 'bold 9px sans-serif'; cx.fillText(c.name[0], p.x, p.y + 3.2); }
      else cx.fillText(c.name.length > 4 ? c.name.slice(0,4) : c.name, p.x, ly);
    } else { cx.fillStyle = '#fff'; cx.font = 'bold 9px sans-serif'; cx.textAlign = 'center'; cx.fillText(c.name[0], p.x, p.y + 3.2); }
    cx.globalAlpha = 1;
  }
}
function frame(t){
  const st = target.st;
  anim.in += (st.in - anim.in) * .05; anim.bl += (st.bl - anim.bl) * .06; anim.te += (st.te - anim.te) * .06;
  for (const c of CH){ const want = st.pr.includes(c.id) ? 1 : (FP.includes(c.id) ? .15 : 0); anim.a[c.id] += (want - anim.a[c.id]) * .07; }
  if ($('#rail').classList.contains('on')) drawCanvas($('#thread'), t, false);
  if ($('#topbar').classList.contains('on')) drawCanvas($('#mThread'), t, true);
  requestAnimationFrame(frame);
}
pick(); requestAnimationFrame(frame);
</script>
